<!DOCTYPE html>
<html lang="cs" data-lang>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Math Express</title>
<style>
  :root {
    --bg: #10151c; --panel: #1b2531; --panel2: #243043; --ink: #eef3f8;
    --muted: #9fb0c4; --accent: #6cc6ff; --ok: #6ee7a8; --bad: #ff8f7a;
    --line: #38485e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #game { display: block; width: 100%; height: 100%; touch-action: manipulation; }
  .overlay { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; background: rgba(9,13,18,.82); }
  .overlay.on { display: flex; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 26px; min-width: 320px; max-width: min(680px, 92vw);
    max-height: 92vh; overflow: auto; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: .5px; }
  h2 { margin: 0 0 14px; font-size: 20px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  button { font: inherit; color: var(--ink); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 16px;
    cursor: pointer; min-height: 44px; }
  button:hover { background: #2e3d55; }
  button.primary { background: var(--accent); color: #06202e; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .menu { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .menuCard { display: flex; gap: 26px; align-items: stretch; }
  .menuMain { min-width: 260px; }
  .langRow { display: flex; align-items: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .langLabel { color: var(--muted); font-size: 13px; }
  .langRow button { padding: 6px 10px; min-height: 34px; font-size: 13px; }
  .langRow button.sel { background: var(--accent); color: #06202e; border-color: var(--accent); }
  .scores { border-left: 1px solid var(--line); padding-left: 22px; min-width: 210px; }
  .scores h3 { margin: 0 0 10px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .scores ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.85; }
  .scores li::marker { color: var(--muted); }
  .scores .pts { font-weight: 600; font-variant-numeric: tabular-nums; }
  .scores .det { color: var(--muted); font-size: 12px; }
  .scores li.fresh .pts { color: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  .row > label:first-child { flex: 0 0 190px; color: var(--muted); font-size: 14px; }
  .ops { display: flex; gap: 8px; }
  .ops button { min-width: 52px; font-size: 19px; }
  .ops button.sel { background: var(--accent); color: #06202e; border-color: var(--accent); }
  input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
  .dual { position: relative; flex: 1; min-width: 150px; height: 34px; }
  .dual .rail, .dual .fill { position: absolute; top: 15px; height: 5px; border-radius: 3px; }
  .dual .rail { left: 0; right: 0; background: var(--panel2); }
  .dual .fill { background: var(--accent); }
  .dual input[type=range] { position: absolute; left: 0; top: 0; width: 100%; height: 34px;
    margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
  .dual input[type=range]::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none;
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
    border: 2px solid #06202e; cursor: pointer; }
  .dual input[type=range]::-moz-range-thumb { pointer-events: auto;
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
    border: 2px solid #06202e; cursor: pointer; }
  input.num { width: 68px; font: inherit; color: var(--ink); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; text-align: right; }
  .dash { color: var(--muted); }
  input[type=color] { width: 46px; height: 34px; padding: 0; border: 1px solid var(--line);
    background: none; border-radius: 6px; }
  .val { min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
  .err { color: var(--bad); font-size: 13px; margin: 6px 0 0; }
  .warn { color: #ffd479; font-size: 13px; margin: 6px 0 0; }
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: 8px 14px;
    display: flex; gap: 18px; align-items: center; pointer-events: none;
    background: linear-gradient(rgba(9,13,18,.85), rgba(9,13,18,0)); font-size: 15px; }
  #hud .msg { flex: 1; text-align: center; font-weight: 600; }
  #hud .msg.ok { color: var(--ok); } #hud .msg.bad { color: var(--bad); }
  #hud button { pointer-events: auto; padding: 5px 12px; min-height: 32px; font-size: 13px; }
  #taskCard { min-width: 300px; }
  .taskLine { font-size: 40px; text-align: center; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
  .taskIn { font-size: 34px; text-align: center; min-height: 46px; letter-spacing: 2px;
    border-bottom: 2px solid var(--line); margin: 0 auto 12px; width: 220px; }
  .bar { height: 8px; background: var(--panel2); border-radius: 5px; overflow: hidden; margin-bottom: 14px; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .1s linear; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pad button { font-size: 22px; padding: 14px 0; }
  .pad .wide { grid-column: span 2; }
  table.stats { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  table.stats th, table.stats td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  table.stats td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .big { font-size: 34px; font-weight: 700; }
  ul.help { color: var(--muted); font-size: 14px; line-height: 1.65; padding-left: 20px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <span id="hudLives">♥♥♥♥♥</span>
  <span id="hudScore">0 b</span>
  <span class="msg" id="hudMsg"></span>
  <span id="hudDelivered">0 ✓</span>
  <button id="btnPause"></button>
  <button id="btnQuit"></button>
</div>

<div class="overlay" id="ovMenu"><div class="card menuCard">
  <div class="menuMain">
    <h1 data-i18n="menu.title"></h1>
    <p class="sub" data-i18n="menu.sub"></p>
    <div class="menu">
      <button class="primary" id="btnNew" data-i18n="menu.new"></button>
      <button id="btnContinue" data-i18n="menu.continue"></button>
      <button id="btnSettings" data-i18n="menu.settings"></button>
      <button id="btnHelp" data-i18n="menu.help"></button>
    </div>
    <div class="langRow"><span class="langLabel" data-i18n="menu.language"></span>
      <span id="menuLang"></span></div>
  </div>
  <div class="scores" id="menuScores"></div>
</div></div>

<div class="overlay" id="ovSettings"><div class="card">
  <h2 data-i18n="set.title"></h2>
  <div class="row"><label data-i18n="set.presets"></label>
    <button data-preset="0" data-i18n="set.preset0"></button>
    <button data-preset="1" data-i18n="set.preset1"></button>
    <button data-preset="2" data-i18n="set.preset2"></button></div>
  <div class="row"><label data-i18n="set.ops"></label><span class="ops" id="setOps"></span></div>
  <div class="row"><label data-i18n="set.numA"></label>
    <span class="dual"><span class="rail"></span><span class="fill" id="fillA"></span>
      <input type="range" id="setAMin" min="0" max="999"><input type="range" id="setAMax" min="0" max="999"></span>
    <input type="number" class="num" id="numAMin" min="0" max="999">
    <span class="dash">–</span>
    <input type="number" class="num" id="numAMax" min="0" max="999"></div>
  <div class="row"><label data-i18n="set.numB"></label>
    <span class="dual"><span class="rail"></span><span class="fill" id="fillB"></span>
      <input type="range" id="setBMin" min="0" max="999"><input type="range" id="setBMax" min="0" max="999"></span>
    <input type="number" class="num" id="numBMin" min="0" max="999">
    <span class="dash">–</span>
    <input type="number" class="num" id="numBMax" min="0" max="999"></div>
  <div class="row"><label data-i18n="set.negative"></label><input type="checkbox" id="setNeg"></div>
  <div class="row"><label data-i18n="set.rareZero"></label><input type="checkbox" id="setRareZero"></div>
  <div class="row"><label data-i18n="set.taskTime"></label>
    <input type="range" id="setTime" min="5" max="60"><span class="val" id="setTimeVal"></span></div>
  <div class="row"><label data-i18n="set.shrink"></label><input type="checkbox" id="setShrink"></div>
  <div class="row"><label data-i18n="set.shrinkStep"></label>
    <input type="range" id="setShrinkStep" min="1" max="20"><span class="val" id="setShrinkStepVal"></span></div>
  <div class="row"><label data-i18n="set.shrinkFloor"></label>
    <input type="range" id="setShrinkFloor" min="3" max="20"><span class="val" id="setShrinkFloorVal"></span></div>
  <div class="row"><label data-i18n="set.speed"></label>
    <input type="range" id="setSpeed" min="0" max="4"><span class="val" id="setSpeedVal"></span></div>
  <div class="row"><label data-i18n="set.carsStep"></label>
    <input type="range" id="setCarsStep" min="1" max="30"><span class="val" id="setCarsStepVal"></span></div>
  <div class="row"><label data-i18n="set.cols"></label>
    <input type="range" id="setCols" min="14" max="18"><span class="val" id="setColsVal"></span></div>
  <div class="row"><label data-i18n="set.palette"></label><span id="setPalette"></span></div>
  <div class="row"><label data-i18n="set.sound"></label><input type="checkbox" id="setSound"></div>
  <p class="err" id="setErr"></p><p class="warn" id="setWarn"></p>
  <div class="row" style="justify-content:flex-end">
    <button id="btnSetCancel" data-i18n="set.back"></button><button class="primary" id="btnSetSave" data-i18n="set.save"></button></div>
</div></div>

<div class="overlay" id="ovHelp"><div class="card">
  <h2 data-i18n="help.title"></h2>
  <ul class="help">
    <li data-i18n-html="help.goal"></li>
    <li data-i18n-html="help.switch"></li>
    <li data-i18n-html="help.stop"></li>
    <li data-i18n-html="help.blocked"></li>
    <li data-i18n-html="help.obstacle"></li>
    <li data-i18n-html="help.noentry"></li>
    <li data-i18n-html="help.depart"></li>
    <li data-i18n-html="help.cars"></li>
    <li data-i18n-html="help.mistake"></li>
    <li data-i18n-html="help.lives"></li>
  </ul>
  <div class="row" style="justify-content:flex-end">
    <button class="primary" id="btnHelpBack" data-i18n="help.back"></button></div>
</div></div>

<div class="overlay" id="ovTask"><div class="card" id="taskCard">
  <div class="taskLine" id="taskText">?</div>
  <div class="taskIn" id="taskInput"></div>
  <div class="bar"><i id="taskBar"></i></div>
  <div class="pad" id="taskPad"></div>
</div></div>

<div class="overlay" id="ovOver"><div class="card">
  <h2 id="overTitle"></h2>
  <div class="row"><span class="big" id="ovScore">0</span><span class="sub" style="margin:0" data-i18n="over.points"></span></div>
  <div id="ovStats"></div>
  <div class="row" style="justify-content:flex-end"><button class="primary" id="btnOverBack" data-i18n="over.back"></button></div>
</div></div>

<script>
/* =========================================================================
   Vláčky — hra pro učení základní matematiky.
   Jediný soubor, bez závislostí, spustitelný z file://.
   Pořadí sekcí je závazné (architecture.md §2.2, §14).
   ========================================================================= */
'use strict';

var QUERY = (function () {
  var s = '';
  try { s = (typeof location !== 'undefined' && location.search) || ''; } catch (e) { s = ''; }
  var q = {};
  s.replace(/^\?/, '').split('&').forEach(function (kv) {
    if (!kv) return; var p = kv.split('='); q[p[0]] = p.length > 1 ? decodeURIComponent(p[1]) : '1';
  });
  return q;
})();

/* ------------------------------------------------------------------ CONFIG */
var CONFIG = (function () {
  /*
   * Délky úseků odpovídají jejich skutečné délce na obrazovce.
   *
   * V izometrii mají tři druhy úseků různou délku: vodorovný úsek je
   * √(0,5² + 0,25²), spojka dolů je na obrazovce svislá (0,5) a spojka
   * nahoru vodorovná (1,0). Kdyby všechny měly logickou délku 1, vlak by
   * na spojce nahoru zdánlivě zrychlil a protáhl se — přesně to se dělo.
   *
   * Doména tím přejímá jednu vlastnost projekce. Je to vědomá výměna:
   * konstantní vizuální rychlost a velikost vlaku za to stojí a hlídá ji
   * test T-REN-023 (poměr obrazovkové a logické délky je u všech hran týž).
   */
  /*
   * Projekce mřížky na obrazovku. Celé natočení kolejiště je dané těmito
   * dvěma vektory: kam se posune bod o jeden sloupec a o jednu trať.
   * Odvozuje se z nich všechno ostatní — délky úseků, rychlosti, velikost
   * vozu i tvar oblouků — takže natočení se mění právě zde a nikde jinde.
   *
   *   COL: krok o sloupec (zleva doprava)
   *   ROW: krok o trať (dolů)
   */
  var COL = { x: 0.5, y: 0.16 };
  var ROW = { x: -0.30, y: 0.30 };

  var U = Math.hypot(COL.x, COL.y);
  var LINK_CURVE = 0.55;

  /*
   * Spojky se kreslí jako S-křivka, která z uzlu vychází ve směru tratě.
   * Jejich skutečná délka je proto větší než vzdálenost koncových uzlů
   * a logickou délkou hrany musí být délka oblouku — jinak by vlak na
   * spojce zdánlivě zpomalil.
   */
  function arcLength(bx, by) {
    var ux = COL.x / U, uy = COL.y / U;
    var d = Math.sqrt(bx * bx + by * by) * LINK_CURVE;
    var p1x = ux * d, p1y = uy * d, p2x = bx - ux * d, p2y = by - uy * d;
    var len = 0, px = 0, py = 0, i, t, m, x, y;
    for (i = 1; i <= 128; i++) {
      t = i / 128; m = 1 - t;
      x = 3 * m * m * t * p1x + 3 * m * t * t * p2x + t * t * t * bx;
      y = 3 * m * m * t * p1y + 3 * m * t * t * p2y + t * t * t * by;
      len += Math.sqrt((x - px) * (x - px) + (y - py) * (y - py));
      px = x; py = y;
    }
    return len;
  }
  var c = {
    UNIT: U,
    ROWS: 5,
    COLS_MIN: 14, COLS_MAX: 18, COLS_DEFAULT: 14,

    CAR_LEN: 0.42 * U,            /* délka vozu jako podíl vodorovného úseku */
    CAR_WIDTH: 0.12,              /* šířka vozu jako podíl měřítka scény */
    CAR_DRAW_FRACTION: 0.92,      /* podíl rozteče, který vůz opticky zabírá */
    MAX_CARS_CAP: 7, MAX_CARS_START: 1,
    MIN_SWITCH_GAP: 1,            /* sloupců mezi výhybkami na téže trati */
    LINK_PROBABILITY: 0.85,
    LEN_STRAIGHT: U,
    /* Spojka dolů je krok o sloupec a o trať, spojka nahoru o sloupec zpět. */
    LEN_LINK_DOWN: arcLength(COL.x + ROW.x, COL.y + ROW.y),
    LEN_LINK_UP: arcLength(COL.x - ROW.x, COL.y - ROW.y),
    PROJ_COL: COL, PROJ_ROW: ROW,
    LINK_CURVE: LINK_CURVE,
    GEN_ATTEMPTS: 200,
    BUILD_ITERATIONS: 60, BUILD_EXTRA_LINKS: 6,
    MIN_LINKS_PER_PAIR: 2,
    MIN_ROUTES_CORNER: 2,

    SPEEDS: [0.30 * U, 0.40 * U, 0.55 * U, 0.70 * U, 0.90 * U],
    SPEED_DEFAULT_INDEX: 1,

    STOP_SECONDS: 10, STOP_BLOCK_SECONDS: 10, ERROR_BLOCK_SECONDS: 1,
    FORFEIT_COOLDOWN_SECONDS: 3,

    /* Provoz se rozjíždí postupně. Na začátku jezdí vlaky řídce a jsou nejvýše
       tři, s přibývajícími doručeními se interval zkracuje a limit roste.
       Bez náběhu byla hra plná už v první minutě. */
    SPAWN_START_MIN: 12, SPAWN_START_MAX: 22,
    SPAWN_MIN: 5, SPAWN_MAX: 12,
    SPAWN_RAMP_DELIVERIES: 40,
    ACTIVE_START: 2, ACTIVE_PER_DELIVERIES: 15,
    MAX_TRAINS_PER_COLOR: 2,
    MAX_ACTIVE_TRAINS: 5, PROTECT_EXTRA: 2 * U,

    LIVES_START: 5, LIVES_CAP: 5,
    DELIVERIES_PER_LIFE: 3, DELIVERIES_PER_CAR: 10,
    CARS_STEP_MIN: 1, CARS_STEP_MAX: 30,
    SCORE_PER_CAR: 10, SCORE_FAST_BONUS: 5, FAST_FRACTION: 0.5,

    TICK: 1 / 120, MAX_FRAME: 0.25,
    TASK_TIME_DEFAULT: 15, TASK_TIME_MIN: 5, TASK_TIME_MAX: 60,
    SHRINK_STEP_DEFAULT: 0.5, SHRINK_FLOOR_DEFAULT: 6, SHRINK_EVERY: 10,
    SHRINK_STEP_MIN: 0.1, SHRINK_STEP_MAX: 2,
    INPUT_MAX_LEN: 7,
    ZERO_KEEP_CHANCE: 0.5,

    PLAN_DT: 0.25, PLAN_HORIZON: 90, PLAN_MAX_STATES: 5000,
    TASK_GEN_TRIES: 200,

    PALETTE_DEFAULT: ['#E69F00', '#56B4E9', '#009E73', '#D55E00', '#CC79A7'],
    DELTA_E_MIN: 20,

    STORAGE_KEY: 'vlacky.v1', SAVE_VERSION: 1, HIGHSCORE_COUNT: 8,
    SELFTEST_NETS: 1000, SELFTEST_TASKS: 10000,
    FALLBACK_SEED: 20240607, MS_PER_SECOND: 1000,

    MSG_SECONDS: 2, SWITCH_ANIM_SECONDS: 0.2,
    PICK_RADIUS: 30, MIN_TARGET_PX: 44,
    SCENE_MARGIN: 0.5, PAD_X: 24, PAD_TOP: 56, PAD_BOTTOM: 24,

    ANNOUNCE_SECONDS: 2.1, PULSE_COUNT: 3, PULSE_STRENGTH: 0.85, PULSE_GROW: 0.22,
    SMOKE_INTERVAL: 0.3, SMOKE_LIFE: 3.4, SMOKE_MAX: 220,
    SMOKE_R0: 0.04, SMOKE_GROWTH: 3.4, SMOKE_RISE: 0.42, SMOKE_ALPHA: 0.38,
    /* Rozvržení lokomotivy v místních souřadnicích vozu: +x je směr jízdy,
       hodnoty jsou podíly délky (x, w) a šířky (y, h, r) vozu. */
    LOCO: {
      boiler: { x: -0.06, w: 0.56, h: 0.74 },
      cab: { x: -0.5, w: 0.44, h: 0.94 },
      chimney: { x: 0.34, r: 0.3, inner: 0.16 },
      dome: { x: 0.08, r: 0.22 }
    },
    NO_ENTRY_R: 0.052,
    /* Zavřená větev má značku zákazu vždy, ale v klidu tlumenou. Sytí se,
     * teprve když se k ní vlak blíží — jinak 42 sytých značek přehluší vlaky. */
    APPROACH_UNITS: 1.3,
    SWITCH_GAP_UNITS: 0.085, NODE_DOT_R: 0.042, ARROW_R: 0.055,
    BLADE_UNITS: 0.17,
    /* Značka zákazu se po zavřené větvi posouvá tak daleko, aby měla od
       otevřené větve odstup NO_ENTRY_CLEAR. U samotného uzlu jsou obě větve
       tečné ke stejnému směru, takže tam leží skoro na sobě. */
    /*
     * Odstup značky od osy otevřené větve. Rozhoduje poloměr značky plus
     * rozvor kolejí: disk značky nesmí zasáhnout kolejnice sousední větve.
     * Okraje jejího štěrkového lože se dotknout smí — je tmavý a nenápadný,
     * a přísnější práh odsouval značku zbytečně daleko od své výhybky.
     */
    NO_ENTRY_CLEAR: 0.095, MARK_STEPS: 64, MARK_MAX_FRACTION: 0.85, MARK_MARGIN: 1.04,
    BALLAST_W: 0.085, GAUGE: 0.03, SLEEPER_PX: 13, SLEEPER_OVERHANG: 1.8,
    COL_BALLAST: '#39414c', COL_RAIL: '#93a1b1', COL_SLEEPER: '#5b6675',
    COL_MARK: '#dce7f2', COL_MARK_DIM: '#6b7787',
    NO_ENTRY_CALM: '#5f302b', NO_ENTRY_HOT: '#d13b2a',
    BAR_CALM: '#9d8f8c', BAR_HOT: '#ffffff',
    STATION: { plat: { w: 0.52, h: 0.17 }, house: { w: 0.36, h: 0.21, off: 0.2 } },
    PLATFORM_TINT: 0.45,
    SHADOW_BLUR: 7, SHADOW_Y: 4,
    EPS: 1e-9
  };
  c.PALETTE_DEFAULT = Object.freeze(c.PALETTE_DEFAULT);
  c.SPEEDS = Object.freeze(c.SPEEDS);
  return Object.freeze(c);
})();

var MAX_TRAIN_LEN = (1 + CONFIG.MAX_CARS_CAP) * CONFIG.CAR_LEN;

/* --------------------------------------------------------------------- RNG */
var RNG = (function () {
  function create(seed) {
    var s = (seed >>> 0) || 1;
    var api = {
      next: function () {
        s = (s + 0x6D2B79F5) >>> 0;
        var t = s;

      ctx.translate(p.x, p.y);
      ctx.rotate(ang);

      /* Nástupiště podél koleje, s lavičkou. Je laděné do barvy nádraží,
         aby barva pomáhala rozlišovat i na okraji zorného pole. */
      ctx.fillStyle = mixHex('#6c7784', col, CONFIG.PLATFORM_TINT);
      rounded(-pw / 2, -ph / 2, pw, ph, ph * 0.3); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = mixHex('#3f4854', col, CONFIG.PLATFORM_TINT * 0.5);
      ctx.fillRect(pw * 0.14, -ph * 0.15, pw * 0.18, ph * 0.3);

      /* Budova: obdélník se sedlovou střechou, tedy hřebenem uprostřed
         a dvěma různě osvětlenými polovinami. */
      ctx.shadowColor = 'rgba(0,0,0,.5)';
      ctx.shadowBlur = CONFIG.SHADOW_BLUR; ctx.shadowOffsetY = CONFIG.SHADOW_Y;
      ctx.fillStyle = col;
      rounded(-hw / 2, -off - hh / 2, hw, hh, Math.max(2, hh * 0.12)); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

      ctx.save();
      rounded(-hw / 2, -off - hh / 2, hw, hh, Math.max(2, hh * 0.12));
      ctx.clip();
      ctx.fillStyle = mix(col, 0.3, 255);
      ctx.fillRect(-hw / 2, -off - hh / 2, hw, hh / 2);
      ctx.fillStyle = mix(col, 0.24, 0);
      ctx.fillRect(-hw / 2, -off, hw, hh / 2);
      ctx.restore();

      ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.lineWidth = Math.max(1, hh * 0.07);
      ctx.beginPath(); ctx.moveTo(-hw / 2, -off); ctx.lineTo(hw / 2, -off); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1.5;
      rounded(-hw / 2, -off - hh / 2, hw, hh, Math.max(2, hh * 0.12)); ctx.stroke();
      ctx.restore();
    }
  }

  function branchEdges(net, n) {
    return n.branchSide === 'L' ? n.edgesL : n.edgesR;
  }

  /** Na kterém konci hrany leží uzel a kterým směrem od něj vede. */
  function fromNode(net, edgeId, nodeId) {
    return net.edges[edgeId].a === nodeId ? { at: 0, to: 1 } : { at: 1, to: 0 };
  }

  /**
   * Jak blízko je vlak, který by po této zavřené větvi vjel do výhybky.
   * 0 = nikdo, 1 = těsně před uzlem. Slouží k sycení značky zákazu.
   */
  function approachHeat(state, nodeId, closedEdgeId) {
    var net = state.net, e = net.edges[closedEdgeId], best = 0;
    for (var i = 0; i < state.trains.length; i++) {
      var tr = state.trains[i];
      if (tr.headEdge !== closedEdgeId) continue;
      var arrivesAt = tr.dir > 0 ? e.b : e.a;
      if (arrivesAt !== nodeId) continue;
      var dist = (tr.dir > 0 ? (1 - tr.headT) : tr.headT) * e.len;
      var h = 1 - dist / CONFIG.APPROACH_UNITS;
      if (h > best) best = h;
    }
    return Math.max(0, Math.min(1, best));
  }

  /**
   * Kam posadit značku zákazu. Obě větve výhybky vycházejí z uzlu stejným
   * směrem, takže těsně u něj splývají; značka se proto posune po zavřené
   * větvi až tam, kde má od otevřené dost místa.
   *
   * Výsledek se ukládá do mezipaměti — geometrie se mění jen přehozením
   * výhybky nebo přepočtem měřítka, ne každý snímek.
   */
  /** Přesná vzdálenost bodu od lomené čáry — vzorkování po bodech ji podstřeluje. */
  function distToPoly(px, py, pts) {
    var best = Infinity, i, ax, ay, bx, by, dx, dy, L2, t, qx, qy, d;
    for (i = 1; i < pts.length; i++) {
      ax = pts[i - 1].x; ay = pts[i - 1].y; bx = pts[i].x; by = pts[i].y;
      dx = bx - ax; dy = by - ay; L2 = dx * dx + dy * dy;
      t = L2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L2)) : 0;
      qx = ax + dx * t; qy = ay + dy * t;
      d = Math.hypot(px - qx, py - qy);
      if (d < best) best = d;
    }
    return best;
  }

  var markCache = {};
  function noEntrySpot(net, n) {
    var be = branchEdges(net, n);
    var closed = be[n.active ? 0 : 1], open = be[n.active];
    var key = n.id + ':' + n.active;
    if (markCache[key]) return markCache[key];

    var clear = scale * CONFIG.NO_ENTRY_CLEAR * CONFIG.MARK_MARGIN;
    var dc = fromNode(net, closed, n.id), dop = fromNode(net, open, n.id);
    var ref = edgePath(net, open, dop.at, dop.at + (dop.to - dop.at) * CONFIG.MARK_MAX_FRACTION);
    var best = null, bestGap = -1, k, i, f, p, gap, d;
    for (k = 1; k <= CONFIG.MARK_STEPS; k++) {
      f = (k / CONFIG.MARK_STEPS) * CONFIG.MARK_MAX_FRACTION;
      p = edgePoint(net, closed, dc.at + (dc.to - dc.at) * f);
      gap = distToPoly(p.x, p.y, ref);
      if (gap >= clear) { markCache[key] = p; return p; }
      if (gap > bestGap) { bestGap = gap; best = p; }
    }
    /*
     * Nouzově bereme místo s největším odstupem. Značka musí zůstat na ose
     * své větve — odsunutí stranou vypadá jako chyba vykreslení a hráč pak
     * neví, ke které koleji značka patří.
     */
    markCache[key] = best;
    return best;
  }

  function drawSwitches(state, blockedNodes) {
    var net = state.net, cooldowns = state.cooldowns || {};
    for (var i = 0; i < net.nodes.length; i++) {
      var n = net.nodes[i];
      if (!n || !n.branchSide) continue;
      var p = nodePos(net, n.id), be = branchEdges(net, n);
      var act = be[n.active], ina = be[n.active ? 0 : 1];
      var resting = cooldowns['switch:' + n.id] > 0;
      var blocked = blockedNodes[n.id];

      /* Jazyk výhybky: krátký světlý úsek po oblouku aktivní větve.
         Spolu s mezerou u zavřené větve (viz edgeSpan) nese informaci
         sama geometrie koleje, ne barevný terč. */
      var d = fromNode(net, act, n.id);
      var span = Math.min(0.45, CONFIG.BLADE_UNITS / net.edges[act].len);
      var t0 = d.at, t1 = d.at + (d.to - d.at) * span;
      var blade = edgePath(net, act, t0, t1);
      var g = Math.max(2, scale * CONFIG.GAUGE);
      var w = Math.max(1.6, scale * 0.02);
      var col = blocked || resting ? CONFIG.COL_MARK_DIM : CONFIG.COL_MARK;
      strokePoly(polyOffset(blade, g), col, w, 'butt');
      strokePoly(polyOffset(blade, -g), col, w, 'butt');

      /* Šipka na konci jazyka, natočená po tečně oblouku. */
      var tip = edgePoint(net, act, t1);
      ctx.save();
      ctx.translate(tip.x, tip.y);
      ctx.rotate(tip.ang + (d.to > d.at ? 0 : Math.PI));
      ctx.fillStyle = col;
      var ar = Math.max(4, scale * CONFIG.ARROW_R);
      ctx.beginPath();
      ctx.moveTo(ar, 0); ctx.lineTo(-ar * 0.55, ar * 0.6); ctx.lineTo(-ar * 0.55, -ar * 0.6);
      ctx.closePath(); ctx.fill();
      ctx.restore();

      /* Značka zákazu na zavřené větvi: v klidu tlumená, sytí se, až když
         se po ní někdo blíží. */
      var mark = noEntrySpot(net, n);
      var heat = approachHeat(state, n.id, ina);
      noEntry(mark.x, mark.y, Math.max(5, scale * CONFIG.NO_ENTRY_R), heat);

      /* Drobný bod uzlu označuje místo kliknutí; zámek jen když vlak zakrývá. */
      var r = Math.max(3, scale * CONFIG.NODE_DOT_R);
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = blocked ? 'rgba(150,160,172,.9)' : 'rgba(18,25,34,.9)';
      ctx.fill();
      ctx.strokeStyle = blocked ? '#8b98aa' : (resting ? '#5c6878' : '#aebfd2');
      ctx.lineWidth = 1.5; ctx.stroke();

      if (blocked) {
        var lr = r * 1.5;
        ctx.fillStyle = '#26313d';
        ctx.fillRect(p.x - lr * 0.34, p.y - lr * 0.08, lr * 0.68, lr * 0.5);
        ctx.strokeStyle = '#26313d'; ctx.lineWidth = Math.max(1.2, lr * 0.16);
        ctx.beginPath(); ctx.arc(p.x, p.y - lr * 0.1, lr * 0.25, Math.PI, 0); ctx.stroke();
      }
    }
  }

  /**
   * Značka zákazu vjezdu. `heat` 0 = klidová tlumená podoba, 1 = plná
   * červená ve chvíli, kdy se po zavřené větvi blíží vlak.
   */
  function noEntry(x, y, r, heat) {
    var fill = mixHex(CONFIG.NO_ENTRY_CALM, CONFIG.NO_ENTRY_HOT, heat);
    var bar = mixHex(CONFIG.BAR_CALM, CONFIG.BAR_HOT, heat);
    ctx.save();
    ctx.globalAlpha = 0.72 + 0.28 * heat;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = Math.max(1, r * 0.16); ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.stroke();
    ctx.fillStyle = bar;
    ctx.fillRect(x - r * 0.58, y - r * 0.17, r * 1.16, r * 0.34);
    ctx.restore();
  }

  function drawTrain(state, tr, alpha) {
    var net = state.net, headT = visualHeadT(state, tr, alpha);
    var carH = Math.max(6, scale * CONFIG.CAR_WIDTH);
    for (var i = tr.cars; i >= 0; i--) {
      var d = (i + 0.5) * CONFIG.CAR_LEN;
      var p = walkBack(net, tr, d, headT);
      /* Délka vozu se odvozuje ze skutečné rozteče na obrazovce, aby vozy
         na sebe navazovaly a nepřekrývaly se. */
      var carW = Math.max(6, CONFIG.CAR_LEN * pxPerUnit(net, p.edge) * CONFIG.CAR_DRAW_FRACTION);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.ang + (tr.dir > 0 ? 0 : Math.PI));
      var loco = i === 0;
      var col = palette[tr.colorIndex] || '#ccc';
      ctx.fillStyle = loco ? '#2a3442' : shade(col);
      ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 2;
      /* Stín kreslí jen podvozek; nástavba už leží na něm. */
      ctx.shadowColor = 'rgba(0,0,0,.55)';
      ctx.shadowBlur = CONFIG.SHADOW_BLUR; ctx.shadowOffsetY = CONFIG.SHADOW_Y;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-carW / 2, -carH / 2, carW, carH, carH * 0.22);
      else ctx.rect(-carW / 2, -carH / 2, carW, carH);
      ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      ctx.stroke();
      if (loco) {
        drawLoco(carW, carH, col);
      } else {
        ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-carW * 0.18, -carH / 2); ctx.lineTo(-carW * 0.18, carH / 2);
        ctx.moveTo(carW * 0.18, -carH / 2); ctx.lineTo(carW * 0.18, carH / 2);
        ctx.stroke();
      }
      ctx.restore();
    }
    var head = walkBack(net, tr, CONFIG.CAR_LEN * 0.2, headT);
    if (tr.state === 'stopped') {
      badge(head.x, head.y - carH * 2.2, Math.ceil(tr.stopTimer) + ' s', '#ffd479', '#3a2f12');
    } else if (tr.stopBlockTimer > 0) {
      badge(head.x, head.y - carH * 2.2, '✕', '#ff8f7a', '#3a1712');
    }
  }

  /* ------------------------------------------------------------------ kouř */
  /* Čistě vizuální stav rendereru. Herní stav o něm neví (zásada Z1) a `draw`
     ho nemutuje — mění se jen privátní pole tohoto modulu. */
  /* Odjezd vlaku ohlásí nádraží trojím plynulým zesvětlením. Renderer si
     na to drží vlastní časovače a bere je z Busu — herní stav o nich neví. */
  var lastNet = null;
  var pulses = {};
  Bus.on('station:announced', function (p) {
    if (p && p.stationId !== undefined) pulses[p.stationId] = p.seconds || CONFIG.ANNOUNCE_SECONDS;
  });

  function tickPulses(dt) {
    for (var k in pulses) {
      pulses[k] -= dt;
      if (pulses[k] <= 0) delete pulses[k];
    }
  }

  /** Obálka pulzu: začíná i končí na nule, mezi tím proběhnou tři vlny. */
  function pulseAmount(stationId) {
    var left = pulses[stationId];
    if (!left) return 0;
    var k = 1 - left / CONFIG.ANNOUNCE_SECONDS;
    return (0.5 - 0.5 * Math.cos(2 * Math.PI * CONFIG.PULSE_COUNT * k)) * CONFIG.PULSE_STRENGTH;
  }

  var puffs = [], emitAt = {}, lastMs = null, paused = false;

  /** Při pauze se kouř zmrazí — jinak by se hra „hýbala" i ve stojící scéně. */
  function setPaused(v) { paused = !!v; }

  /** Vrchol komínu lokomotivy v obrazovkových souřadnicích. */
  function chimneyTop(state, tr, headT) {
    var net = state.net;
    var p = walkBack(net, tr, CONFIG.CAR_LEN * 0.5, headT);
    var carH = Math.max(6, scale * CONFIG.CAR_WIDTH);
    var carW = Math.max(6, CONFIG.CAR_LEN * pxPerUnit(net, p.edge) * CONFIG.CAR_DRAW_FRACTION);
    var lx = carW * CONFIG.LOCO.chimney.x * tr.dir, ly = 0;
    var cos = Math.cos(p.ang), sin = Math.sin(p.ang);
    return { x: p.x + lx * cos - ly * sin, y: p.y + lx * sin + ly * cos };
  }

  function emitSmoke(state, dt, alpha) {
    for (var i = 0; i < state.trains.length; i++) {
      var tr = state.trains[i];
      if (tr.state !== 'running') continue;
      var e = (emitAt[tr.id] || 0) - dt;
      if (e > 0) { emitAt[tr.id] = e; continue; }
      emitAt[tr.id] = CONFIG.SMOKE_INTERVAL;
      if (puffs.length >= CONFIG.SMOKE_MAX) puffs.shift();
      var p = chimneyTop(state, tr, visualHeadT(state, tr, alpha || 0));
      puffs.push({
        x: p.x, y: p.y,
        age: 0, color: palette[tr.colorIndex] || '#ccc',
        /* Rozptyl bez Math.random — náhoda patří výhradně do RNG (REQ-ARC-013). */
        wobble: (((tr.id * 37 + puffs.length * 13) % 100) / 100 - 0.5) * scale * 0.09
      });
    }
    var live = [];
    for (i = 0; i < puffs.length; i++) {
      puffs[i].age += dt;
      if (puffs[i].age < CONFIG.SMOKE_LIFE) live.push(puffs[i]);
    }
    puffs = live;
  }

  function drawSmoke() {
    ctx.save();
    for (var i = 0; i < puffs.length; i++) {
      var p = puffs[i], k = p.age / CONFIG.SMOKE_LIFE;
      var r = scale * CONFIG.SMOKE_R0 * (1 + CONFIG.SMOKE_GROWTH * k);
      ctx.globalAlpha = CONFIG.SMOKE_ALPHA * (1 - k) * (1 - k);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x + p.wobble * k, p.y - scale * CONFIG.SMOKE_RISE * k, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /**
   * Lokomotiva z ptačí perspektivy: podvozek, na něm válec motoru s komínem
   * a parním dómem, na druhém konci kabina strojvedoucího.
   * Kreslí se v místních souřadnicích, kde +x je směr jízdy.
   */
  function drawLoco(carW, carH, col) {
    var L = CONFIG.LOCO;

    /* Kabina — tmavší odstín barvy vlaku, s prosklením. */
    ctx.fillStyle = shade(col);
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.5;
    rounded(carW * L.cab.x, -carH * L.cab.h / 2, carW * L.cab.w, carH * L.cab.h, carH * 0.14);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(210,232,255,.5)';
    ctx.fillRect(carW * (L.cab.x + 0.08), -carH * 0.3, carW * L.cab.w * 0.55, carH * 0.6);

    /* Válec motoru posazený na podvozku. */
    ctx.fillStyle = col;
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.5;
    rounded(carW * L.boiler.x, -carH * L.boiler.h / 2, carW * L.boiler.w, carH * L.boiler.h, carH * 0.16);
    ctx.fill(); ctx.stroke();

    /* Parní dóm v barvě vlaku, jen světlejší. */
    ctx.beginPath();
    ctx.arc(carW * L.dome.x, 0, carH * L.dome.r, 0, Math.PI * 2);
    ctx.fillStyle = tint(col); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1; ctx.stroke();

    /* Komín u kraje motoru, na šířku uprostřed. */
    ctx.beginPath();
    ctx.arc(carW * L.chimney.x, 0, carH * L.chimney.r, 0, Math.PI * 2);
    ctx.fillStyle = '#1a222c'; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath();
    ctx.arc(carW * L.chimney.x, 0, carH * L.chimney.inner, 0, Math.PI * 2);
    ctx.fillStyle = '#080b10'; ctx.fill();
  }

  function rounded(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  function badge(x, y, text, bg, fg) {
    ctx.save();
    ctx.font = '600 12px system-ui, sans-serif';
    var w = ctx.measureText(text).width + 12;
    ctx.fillStyle = bg;
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x - w / 2, y - 9, w, 18, 9); }
    else { ctx.rect(x - w / 2, y - 9, w, 18); }
    ctx.fill();
    ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function mix(hex, factor, towards) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    if (!m) return hex;
    return '#' + [1, 2, 3].map(function (i) {
      var v = parseInt(m[i], 16);
      return ('0' + Math.round(v + (towards - v) * factor).toString(16)).slice(-2);
    }).join('');
  }
  /** Lineární přechod mezi dvěma odstíny. */
  function mixHex(a, b, f) {
    var re = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i;
    var ma = re.exec(a), mb = re.exec(b);
    if (!ma || !mb) return a;
    return '#' + [1, 2, 3].map(function (i) {
      var v = parseInt(ma[i], 16) + (parseInt(mb[i], 16) - parseInt(ma[i], 16)) * f;
      return ('0' + Math.round(v).toString(16)).slice(-2);
    }).join('');
  }

  function shade(hex) { return mix(hex, 0.38, 0); }
  function tint(hex) { return mix(hex, 0.42, 255); }

  function blockedNodeMap(state) {
    var map = {}, bs = Sim.bodies(state);
    for (var i = 0; i < bs.length; i++) {
      var ns = Sim.nodesOf(state.net, bs[i].body.segs);
      for (var j = 0; j < ns.length; j++) if (state.net.nodes[ns[j]].branchSide) map[ns[j]] = true;
    }
    return map;
  }

  function clockMs() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  }

  function draw(state, alpha) {
    if (!ctx) return;
    lastState = state;
    /* Nová partie může mít stejné rozměry, ale jinou síť — uložené polohy
       značek by pak patřily k jiným výhybkám. */
    if (state.net !== lastNet) { lastNet = state.net; markCache = {}; }
    ensureLayout(state.net);

    var ms = clockMs();
    var dt = (lastMs === null || paused) ? 0
      : Math.min(0.1, Math.max(0, (ms - lastMs) / CONFIG.MS_PER_SECOND));
    lastMs = ms;
    if (!paused) { emitSmoke(state, dt, alpha); tickPulses(dt); }

    ctx.clearRect(0, 0, W, H);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#131b25'); g.addColorStop(1, '#0d1219');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    var net = state.net;
    drawTrack(net);
    drawStations(net);
    drawSwitches(state, blockedNodeMap(state));
    var sorted = state.trains.slice().sort(function (a, b) {
      return nodePos(net, net.edges[a.headEdge].a).y - nodePos(net, net.edges[b.headEdge].a).y;
    });
    for (var i = 0; i < sorted.length; i++) drawTrain(state, sorted[i], alpha);
    drawSmoke();

    if (state.inputBlockTimer > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(255,143,122,.16)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  /** Trefa: lokomotiva má přednost před výhybkou pod ní (REQ-STP-012). */
  function pick(x, y) {
    if (!lastState) return { type: 'none', id: -1 };
    var net = lastState.net, radius = Math.max(CONFIG.PICK_RADIUS, CONFIG.MIN_TARGET_PX / 2);
    var best = null, bestD = radius * radius;
    for (var i = 0; i < lastState.trains.length; i++) {
      var tr = lastState.trains[i];
      var p = walkBack(net, tr, CONFIG.CAR_LEN * 0.5, tr.headT);
      var d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      if (d < bestD) { bestD = d; best = { type: 'loco', id: tr.id }; }
    }
    if (best) return best;
    /*
     * Zásah výhybky pokrývá uzel i její značku zákazu — hráč má sklon klikat
     * na značku. Vyhrává nejbližší výhybka, takže se oblasti nemohou překrýt
     * nejednoznačně: klik na značku je od vlastní výhybky vzdálen nula.
     */
    var swR = Math.max(CONFIG.PICK_RADIUS, CONFIG.MIN_TARGET_PX / 2);
    bestD = swR * swR;
    for (var j = 0; j < net.nodes.length; j++) {
      var n = net.nodes[j];
      if (!n || !n.branchSide) continue;
      var q = nodePos(net, n.id);
      var dd = (q.x - x) * (q.x - x) + (q.y - y) * (q.y - y);
      var m = noEntrySpot(net, n);
      var dm = (m.x - x) * (m.x - x) + (m.y - y) * (m.y - y);
      if (dm < dd) dd = dm;
      if (dd < bestD) { bestD = dd; best = { type: 'switch', id: n.id }; }
    }
    return best || { type: 'none', id: -1 };
  }

  function dispose() { cv = null; ctx = null; lastState = null; }

  return {
    init: init, resize: resize, draw: draw, pick: pick, dispose: dispose,
    setPalette: setPalette, setPaused: setPaused, gridToScreen: gridToScreen,
    edgePoint: edgePoint, noEntrySpot: noEntrySpot
  };
})();

/* ------------------------------------------------------------------- Audio */
var Audio = (function () {
  var actx = null, enabled = true, failed = false;

  function ensure() {
    if (actx || failed) return actx;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) { failed = true; return null; }
      actx = new C();
    } catch (e) { failed = true; }
    return actx;
  }

  function tone(freq, dur, type, gain) {
    if (!enabled) return;
    var a = ensure();
    if (!a) return;
    try {
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || 'triangle'; o.frequency.value = freq;
      g.gain.value = gain || 0.06;
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + dur);
    } catch (e) { /* zvuk je nepovinný */ }
  }

  function seq(list) {
    list.forEach(function (n, i) { setTimeout(function () { tone(n[0], n[1]); }, i * 90); });
  }

  function init() {
    Bus.on('switch:thrown', function () { tone(520, 0.08, 'square', 0.04); });
    Bus.on('task:resolved', function (p) {
      if (p.outcome === 'ok') seq([[660, 0.1], [880, 0.14]]);
      else seq([[400, 0.12], [280, 0.18]]);
    });
    Bus.on('train:stopped', function () { tone(180, 0.25, 'sawtooth', 0.03); });
    Bus.on('train:delivered', function () { seq([[660, 0.1], [830, 0.1], [990, 0.18]]); });
    Bus.on('train:lost', function () { tone(90, 0.35, 'sawtooth', 0.07); });
  }

  return {
    init: init, setEnabled: function (v) { enabled = v; },
    isReady: function () { return !!actx; }
  };
})();

/* ------------------------------------------------------------------- Stats */
var Stats = (function () {

  function summary(st) {
    var rows = [];
    for (var op in st.byOp) {
      rows.push({ op: op, total: st.byOp[op].total, ok: st.byOp[op].ok });
    }
    var mistakes = Object.keys(st.mistakes)
      .map(function (k) { return { key: k, n: st.mistakes[k] }; })
      .sort(function (a, b) { return b.n - a.n; })
      .slice(0, 3);
    return {
      total: st.total, ok: st.ok, wrong: st.wrong, timeout: st.timeout, forfeit: st.forfeit,
      rate: st.total ? Math.round(st.ok / st.total * 100) : 0,
      byOp: rows, mistakes: mistakes
    };
  }

  return { summary: summary };
})();

/* ------------------------------------------------------------------ Scores */
/* Žebříček je čistá funkce nad polem záznamů — ukládání řeší Persist. */
var Scores = (function () {
  function add(list, entry, max) {
    var out = (list || []).slice();
    out.push(entry);
    out.sort(function (a, b) {
      return (b.score - a.score) || (b.delivered - a.delivered) || (a.date - b.date);
    });
    return out.slice(0, max === undefined ? CONFIG.HIGHSCORE_COUNT : max);
  }

  /** Pořadí, na které by se výsledek zařadil (1 = nejlepší), nebo 0. */
  function rank(list, entry, max) {
    var placed = add(list, entry, max);
    for (var i = 0; i < placed.length; i++) if (placed[i] === entry) return i + 1;
    return 0;
  }

  function sanitize(list) {
    if (!Array.isArray(list)) return [];
    return list.filter(function (e) {
      return e && isFinite(e.score) && isFinite(e.delivered);
    }).slice(0, CONFIG.HIGHSCORE_COUNT);
  }

  return { add: add, rank: rank, sanitize: sanitize };
})();

/* ----------------------------------------------------------------- Persist */
var Persist = (function () {
  function store() {
    try { return window.localStorage || null; } catch (e) { return null; }
  }
  function save(obj) {
    var s = store(); if (!s) return false;
    try { s.setItem(CONFIG.STORAGE_KEY, JSON.stringify(obj)); return true; } catch (e) { return false; }
  }
  function load() {
    var s = store(); if (!s) return null;
    try {
      var raw = s.getItem(CONFIG.STORAGE_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || obj.version !== CONFIG.SAVE_VERSION) return null;
      return obj;
    } catch (e) { return null; }
  }
  function hasSave() { var o = load(); return !!(o && o.game); }
  function clear() { var s = store(); if (!s) return; try { s.removeItem(CONFIG.STORAGE_KEY); } catch (e) { } }
  function available() {
    var s = store(); if (!s) return false;
    try { s.setItem(CONFIG.STORAGE_KEY + '.probe', '1'); s.removeItem(CONFIG.STORAGE_KEY + '.probe'); return true; }
    catch (e) { return false; }
  }
  return { save: save, load: load, hasSave: hasSave, clear: clear, available: available };
})();

/* -------------------------------------------------------------- TaskDialog */
/* Tenká obálka nad TaskOutcome. Veškerá pravidla vyhodnocení jsou v doméně. */
var TaskDialog = (function () {
  var el = {}, task = null, value = '', startMs = 0, limitMs = 0, cb = null, open = false;
  var allowNeg = false;

  function init() {
    el.ov = document.getElementById('ovTask');
    el.text = document.getElementById('taskText');
    el.input = document.getElementById('taskInput');
    el.bar = document.getElementById('taskBar');
    el.pad = document.getElementById('taskPad');
    var rows = [['1', '2', '3'], ['4', '5', '6'], ['7', '8', '9'], ['-', '0', 'back']];
    var labels = { back: '⌫' };
    rows.forEach(function (row) {
      row.forEach(function (k) {
        var b = document.createElement('button');
        b.textContent = labels[k] || k;
        b.setAttribute('data-key', k);
        b.addEventListener('click', function () { press(k); });
        el.pad.appendChild(b);
      });
    });
    ['ok', 'giveup'].forEach(function (k) {
      var b = document.createElement('button');
      b.setAttribute('data-i18n', 'task.' + k);
      b.className = k === 'ok' ? 'primary wide' : '';
      b.addEventListener('click', function () { press(k); });
      el.pad.appendChild(b);
    });
  }

  function show(t, limitSeconds, allowNegative, onResolve) {
    task = t; value = ''; limitMs = limitSeconds * 1000; cb = onResolve;
    allowNeg = !!allowNegative; open = true;
    startMs = now();
    el.text.textContent = MathTasks.text(task);
    render();
    el.ov.classList.add('on');
  }

  function now() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }

  function render() {
    el.input.textContent = value || ' ';
    var left = Math.max(0, 1 - (now() - startMs) / limitMs);
    el.bar.style.width = (left * 100) + '%';
  }

  function press(key) {
    if (!open) return;
    if (key === 'ok') return resolve('submit');
    if (key === 'giveup') return resolve('forfeit');
    value = TaskOutcome.append(value, key, allowNeg);
    render();
  }

  function key(ev) {
    if (!open) return false;
    if (ev.key === 'Enter') { press('ok'); return true; }
    if (ev.key === 'Escape') { press('giveup'); return true; }
    if (ev.key === 'Backspace') { press('back'); return true; }
    if (/^[0-9]$/.test(ev.key)) { press(ev.key); return true; }
    if (ev.key === '-') { press('-'); return true; }
    return false;
  }

  function tick() {
    if (!open) return;
    render();
    if (now() - startMs >= limitMs) resolve('tick');
  }

  function resolve(action) {
    var res = TaskOutcome.evaluate(task, value, now() - startMs, limitMs, action);
    if (!res.outcome) return;
    open = false;
    el.ov.classList.remove('on');
    var t = task, f = cb;
    task = null; cb = null;
    if (f) f(res, t);
  }

  return { init: init, show: show, key: key, tick: tick, isOpen: function () { return open; } };
})();

      if (el[k]) el[k].classList.toggle('on', k === name);
    });
  }

  function hideAll() { showOverlay(null); }

  function menu(hasSave, scores, freshIndex) {
    $('btnContinue').disabled = !hasSave;
    var box = $('menuScores');
    scores = scores || [];
    if (!scores.length) {
      box.innerHTML = '';
      box.style.display = 'none';
    } else {
      box.style.display = '';
      var html = '<h3>' + I18N.t('menu.scores') + '</h3><ol>';

  /* ---- nastavení ---- */

  function openSettings(current, saved) {
    draft = Settings.clone(current);
    onSaved = saved;
    bindSettings();
    syncSettings();
    showOverlay('settings');
  }

  var bound = false;
  function bindSettings() {
    if (bound) return;
    bound = true;
    var num = [
      ['setAMin', 'aMin'], ['setAMax', 'aMax'], ['setBMin', 'bMin'], ['setBMax', 'bMax'],
      ['setTime', 'taskTime'], ['setSpeed', 'speedIndex'], ['setCols', 'cols'],
      ['setCarsStep', 'carsPerStep'],
      ['setShrinkFloor', 'shrinkFloor']
    ];
    num.forEach(function (p) {
      $(p[0]).addEventListener('input', function (ev) {
        draft[p[1]] = +ev.target.value;
        clampRanges(p[1]);
        syncSettings();
      });
    });
    /* Textová pole jsou plnohodnotnou druhou cestou k témuž údaji. */
    [['numAMin', 'aMin'], ['numAMax', 'aMax'], ['numBMin', 'bMin'], ['numBMax', 'bMax']]
      .forEach(function (p) {
        $(p[0]).addEventListener('change', function (ev) {
          var v = parseInt(ev.target.value, 10);
          if (!isFinite(v)) { syncSettings(); return; }
          draft[p[1]] = Math.max(0, Math.min(999, v));
          clampRanges(p[1]);
          syncSettings();
        });
      });
    $('setShrinkStep').addEventListener('input', function (ev) {
      draft.shrinkStep = (+ev.target.value) / 10; syncSettings();
    });
    [['setNeg', 'allowNegative'], ['setRareZero', 'rareZero'],
     ['setShrink', 'shrink'], ['setSound', 'sound']].forEach(function (p) {
      $(p[0]).addEventListener('change', function (ev) { draft[p[1]] = ev.target.checked; syncSettings(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (b) {
      b.addEventListener('click', function () {
        draft = Settings.preset(+b.getAttribute('data-preset'));
        syncSettings();
      });
    });
    $('btnSetSave').addEventListener('click', function () {
      if (Settings.validate(draft).length) return;
      if (onSaved) onSaved(Settings.clone(draft));
    });
  }

  /** Konce rozsahu se nesmí prohodit (REQ-SET-017); posouvá ten druhý. */
  function clampRanges(changed) {
    if (changed === 'aMin' && draft.aMin > draft.aMax) draft.aMax = draft.aMin;
    if (changed === 'aMax' && draft.aMax < draft.aMin) draft.aMin = draft.aMax;
    if (changed === 'bMin' && draft.bMin > draft.bMax) draft.bMax = draft.bMin;
    if (changed === 'bMax' && draft.bMax < draft.bMin) draft.bMin = draft.bMax;
  }

  function syncRange(which, lo, hi) {
    $('set' + which + 'Min').value = lo;
    $('set' + which + 'Max').value = hi;
    $('num' + which + 'Min').value = lo;
    $('num' + which + 'Max').value = hi;
    var f = $('fill' + which);
    f.style.left = (lo / 999 * 100) + '%';
    f.style.width = ((hi - lo) / 999 * 100) + '%';
    /* Leží-li úchyty na sobě, musí být navrchu ten, který má kam ustoupit. */
    $('set' + which + 'Min').style.zIndex = lo > 999 - hi ? 3 : 2;
  }

  function syncSettings() {
    syncRange('A', draft.aMin, draft.aMax);
    syncRange('B', draft.bMin, draft.bMax);
    $('setNeg').checked = draft.allowNegative;
    $('setRareZero').checked = draft.rareZero;
    $('setTime').value = draft.taskTime;
    $('setTimeVal').textContent = draft.taskTime + ' ' + I18N.t('unit.seconds');
    $('setShrink').checked = draft.shrink;
    $('setShrinkStep').value = Math.round(draft.shrinkStep * 10);
    $('setShrinkStepVal').textContent = draft.shrinkStep.toFixed(1) + ' ' + I18N.t('unit.seconds');
    $('setShrinkFloor').value = draft.shrinkFloor;
    $('setShrinkFloorVal').textContent = draft.shrinkFloor + ' ' + I18N.t('unit.seconds');
    $('setSpeed').value = draft.speedIndex;
    $('setSpeedVal').textContent = I18N.t('speed.' + draft.speedIndex);
    $('setCarsStep').value = draft.carsPerStep;
    $('setCarsStepVal').textContent = I18N.count('unit.trains', draft.carsPerStep);
    $('setCols').value = draft.cols;
    $('setColsVal').textContent = draft.cols;
    $('setSound').checked = draft.sound;
    Array.prototype.forEach.call(el.ops.children, function (b) {
      b.classList.toggle('sel', draft.ops.indexOf(b.getAttribute('data-op')) >= 0);
    });
    Array.prototype.forEach.call(el.palette.children, function (inp) {

    var errs = Settings.validate(draft);
    el.err.textContent = errs.map(function (code) {
      return I18N.t('err.' + code.split(':')[0]);
    }).join(' ');
    var warns = Settings.warnings(draft);
    el.warn.textContent = warns.length ? I18N.t('warn.palette') : '';
    $('btnSetSave').disabled = errs.length > 0;
  }

/* Výhradně Pointer Events — dotyk ani myš nesmí událost zdvojit (REQ-INP-004). */

/* -------------------------------------------------------------------- Game */
var Game = (function () {
  var mode = 'MENU', state = null, settings = null;
  var message = '', messageKind = '', messageTimer = 0;
  var pending = null, scores = [], freshIndex = -1;

  function setMode(m) { mode = m; }
  function getMode() { return mode; }
  function isPaused() { return mode !== 'PLAY'; }
  function getState() { return state; }

  function loadSettings() {
    var saved = Persist.load();
    var merged = Settings.merge(saved && saved.settings);
    settings = Settings.validate(merged).length === 0 ? merged : Settings.defaults();
    I18N.set(settings.lang);
    scores = Scores.sanitize(saved && saved.scores);
    return settings;
  }

  function getScores() { return scores; }
  function getFreshIndex() { return freshIndex; }

  function persist() {
    Persist.save({
      version: CONFIG.SAVE_VERSION,
      settings: settings,
      scores: scores,
      game: state && !state.over ? Sim.serialize(state) : null
    });
  }

  function newGame(seedOverride) {
    if (seedOverride === undefined || seedOverride === null) {
      seedOverride = QUERY.seed ? parseInt(QUERY.seed, 10) : null;
    }
    state = Sim.create(settings, seedOverride);
    Renderer2D.setPalette(settings.palette);
    Audio.setEnabled(settings.sound);
    message = ''; messageTimer = 0;
    freshIndex = -1;
    setMode('PLAY');
    UI.hideAll();
    persist();
  }

  function continueGame() {
    var saved = Persist.load();
    if (!saved || !saved.game) return false;
    var restored = Sim.restore(saved.game);
    if (!restored) return false;
    state = restored;
    settings = state.settings;
    Renderer2D.setPalette(settings.palette);
    Audio.setEnabled(settings.sound);
    setMode('PLAY');
    UI.hideAll();
    return true;
  }

  function say(text, kind) {
    message = text; messageKind = kind || '';
    messageTimer = CONFIG.MSG_SECONDS;
  }

  /* ---- zásahy hráče ---- */

  function onPoint(x, y) {
    if (mode !== 'PLAY' || !state) return;
    var hit = Renderer2D.pick(x, y);
    if (hit.type === 'switch') tryThrow(hit.id);
    else if (hit.type === 'loco') tryLoco(hit.id);
  }

  /* Důvody, které hráči nemá smysl hlásit — na klik prostě nic nedělá. */
  var QUIET = {
    'already-stopped': 1, 'not-a-switch': 1, 'no-train': 1,
    'game-over': 1, 'not-stopped': 1
  };
  function reasonText(code) { return QUIET[code] ? '' : I18N.t('msg.' + code); }

  function tryThrow(nodeId) {
    var can = Sim.canThrowSwitch(state, nodeId);
    if (!can.ok) { say(reasonText(can.reason), 'bad'); return; }
    openTask('switch', nodeId);
  }

  function tryLoco(trainId) {
    var t = Sim.trainById(state, trainId);
    if (!t) return;
    if (t.state === 'stopped') {
      var rel = Sim.canRelease(state, trainId);
      if (!rel.ok) { say(reasonText(rel.reason), 'bad'); return; }
      Sim.releaseTrain(state, trainId);
      return;
    }
    var can = Sim.canStop(state, trainId);
    if (!can.ok) { say(reasonText(can.reason), 'bad'); return; }
    openTask('loco', trainId);
  }

  /** Příklad vzniká teprve tady — nikdy dopředu (REQ-MTH-001/002). */
  function openTask(kind, id) {
    var task = Sim.nextTask(state);
    if (!task) return;
    pending = { kind: kind, id: id };
    setMode('TASK');
    TaskDialog.show(task, state.taskTimeCurrent, state.settings.allowNegative, onTaskResolved);
  }

  function onTaskResolved(res, task) {
    var p = pending; pending = null;
    Sim.recordTask(state, task, res.outcome, res.fast);
    if (res.outcome === 'ok') {
      if (p.kind === 'switch') Sim.throwSwitch(state, p.id);
      else Sim.stopTrain(state, p.id);
      say(I18N.t('msg.correct'), 'ok');
    } else if (res.outcome === 'forfeit') {
      /* Vzdání se nic nestojí. Jen na tentýž objekt chvíli nejde kliknout,
         aby se dialog nedal otevírat dokola. */
      Sim.blockObject(state, (p.kind === 'switch' ? 'switch:' : 'train:') + p.id,
        CONFIG.FORFEIT_COOLDOWN_SECONDS);
      say(I18N.t('msg.left'), '');
    } else {
      Sim.blockInput(state, CONFIG.ERROR_BLOCK_SECONDS);
      if (p.kind === 'loco') Sim.blockStop(state, p.id);
      say(I18N.t('msg.wrong', { n: task.result }), 'bad');
    }
    setMode('PLAY');
    persist();
  }

  /** Zapíše dosažený výsledek do žebříčku a smaže rozehranou partii. */
  function recordScore() {
    if (!state) return;
    var entry = {
      score: state.score, delivered: state.delivered,
      rate: Stats.summary(state.stats).rate, date: Date.now()
    };
    freshIndex = Scores.rank(scores, entry) - 1;
    scores = Scores.add(scores, entry);
    Persist.save({
      version: CONFIG.SAVE_VERSION, settings: settings, scores: scores, game: null
    });
  }

  /**
   * Ukončí rozehranou hru a vrátí se do menu. Dosažený výsledek se do
   * žebříčku započítá — hráč si ho odehrál, jen se rozhodl skončit dřív.
   */
  function quitToMenu() {
    recordScore();
    state = null;
    setMode('MENU');
  }

  function onKey(ev) {
    if (mode === 'TASK') { if (TaskDialog.key(ev)) ev.preventDefault(); return; }
    if (ev.key === 'p' || ev.key === 'P') {
      if (mode === 'PLAY') setMode('PAUSED');
      else if (mode === 'PAUSED') setMode('PLAY');
    }
  }

  function update(dt) {
    if (!state) return;
    Sim.update(state, dt);
    if (state.over && mode !== 'GAMEOVER') {
      setMode('GAMEOVER');
      recordScore();
      UI.gameOver(state, freshIndex);
    }
  }

  function frame(nowMs, dt) {
    if (mode === 'TASK') TaskDialog.tick();
    if (messageTimer > 0) {
      messageTimer -= dt;
      if (messageTimer <= 0) { message = ''; messageKind = ''; }
    }
    UI.hud(state, mode === 'PAUSED' ? 'Pauza' : message, messageKind, mode === 'PAUSED');
  }

  return {
    setMode: setMode, getMode: getMode, isPaused: isPaused, getState: getState,
    newGame: newGame, continueGame: continueGame, loadSettings: loadSettings,
    getScores: getScores, getFreshIndex: getFreshIndex,
    onPoint: onPoint, onKey: onKey, update: update, frame: frame, persist: persist,
    quitToMenu: quitToMenu,
    setSettings: function (s) {
      settings = s;
      Renderer2D.setPalette(s.palette);
      Audio.setEnabled(s.sound);
      I18N.set(s.lang);
    },
    setLanguage: function (code) {
      settings.lang = code;
      I18N.set(code);
      persist();
    },
    getSettings: function () { return settings; }
  };
})();

/* ---------------------------------------------------------------- SelfTest */
var SelfTest = (function () {
  function run(log) {
    log = log || function (s) { if (typeof console !== 'undefined') console.log(s); };
    var failures = [], i;

    var rng = RNG.create(1);
    var firstTry = 0;
    for (i = 0; i < CONFIG.SELFTEST_NETS; i++) {
      var cols = CONFIG.COLS_MIN + (i % (CONFIG.COLS_MAX - CONFIG.COLS_MIN + 1));
      var net = Network.build(rng, cols);
      var errs = Network.validate(net);
      if (errs.length === 0) firstTry++;
      else {
        var fixed = Network.generate(RNG.create(i + 1), cols);
        var e2 = Network.validate(fixed);
        if (e2.length) failures.push('síť(' + cols + ', seed ' + (i + 1) + '): ' + e2.join(','));
      }
    }

    var ranges = [
      { aMin: 0, aMax: 10, bMin: 0, bMax: 10 },
      { aMin: 0, aMax: 100, bMin: 1, bMax: 10 },
      { aMin: 0, aMax: 999, bMin: 0, bMax: 999 }
    ];
    var ops = ['+', '-', '*', '/'];
    for (var o = 0; o < ops.length; o++) {
      for (var r = 0; r < ranges.length; r++) {
        var s = Settings.defaults();
        s.ops = [ops[o]];
        s.aMin = ranges[r].aMin; s.aMax = ranges[r].aMax;
        s.bMin = ranges[r].bMin; s.bMax = ranges[r].bMax;
        if (MathTasks.usableOps(s).length === 0) continue;
        var trng = RNG.create(1000 + o * 10 + r), last = null;
        for (i = 0; i < CONFIG.SELFTEST_TASKS; i++) {
          var t = MathTasks.generate(trng, s, last);
          if (!t) { failures.push('příklad ' + ops[o] + ' r' + r + ': null'); break; }
          var bad = null;
          if (t.b < s.bMin || t.b > s.bMax) { if (!(t.op === '/' && t.b === 1 && s.bMin === 0)) bad = 'b mimo rozsah'; }
          if (t.a < s.aMin || t.a > s.aMax) bad = 'a mimo rozsah';
          if (t.op === '/' && (t.b === 0 || t.a !== t.b * t.result)) bad = 'dělení';
          if (t.op === '/' && !Number.isInteger(t.result)) bad = 'necelý podíl';
          if (t.op === '-' && !s.allowNegative && t.result < 0) bad = 'záporný výsledek';
          if (last && last.op === t.op && last.a === t.a && last.b === t.b) bad = 'opakování';
          if (bad) { failures.push('příklad ' + ops[o] + ' r' + r + ': ' + bad + ' (' + t.a + t.op + t.b + ')'); break; }
          last = t;
        }
      }
    }

    var pct = Math.round(firstTry / CONFIG.SELFTEST_NETS * 100);
    log('Vláčky self-test: sítí ' + CONFIG.SELFTEST_NETS + ' (na první pokus platných ' + pct + ' %), ' +
        'příkladů ' + (CONFIG.SELFTEST_TASKS * ops.length * ranges.length));
    if (failures.length) {
      log('SELHALO — ' + failures.length + ' problémů:');
      failures.slice(0, 20).forEach(function (f) { log('  • ' + f); });
    } else {
      log('OK — všechny invarianty platí.');
    }
    return { ok: failures.length === 0, failures: failures, firstTryPercent: pct };
  }
  return { run: run };
})();

/* -------------------------------------------------------------------- main */
function main() {
  var canvas = document.getElementById('game');
  UI.init();
  TaskDialog.init();
  Audio.init();

  var settings = Game.loadSettings();
  UI.applyTexts();
  UI.setLangHandler(function (code) {
    Game.setLanguage(code);
    UI.applyTexts();
    UI.menu(Persist.hasSave(), Game.getScores(), Game.getFreshIndex());
  });
  Renderer2D.init(canvas, { palette: settings.palette });
  Audio.setEnabled(settings.sound);

  function fit() {
    Renderer2D.resize(window.innerWidth, window.innerHeight, window.devicePixelRatio || 1);
  }
  window.addEventListener('resize', fit);
  fit();

  Input.init(canvas, function (ev) {
    if (ev.type === 'point') Game.onPoint(ev.x, ev.y);
    else Game.onKey(ev.ev);
  });

  document.getElementById('btnNew').addEventListener('click', function () {
    Game.newGame();
  });
  document.getElementById('btnContinue').addEventListener('click', function () {
    if (!Game.continueGame()) UI.menu(false, Game.getScores(), Game.getFreshIndex());
  });
  document.getElementById('btnSettings').addEventListener('click', function () {
    UI.openSettings(Game.getSettings(), function (saved) {
      Game.setSettings(saved);
      Game.persist();
      UI.applyTexts();
      UI.menu(Persist.hasSave(), Game.getScores(), Game.getFreshIndex());
    });
  });
  document.getElementById('btnSetCancel').addEventListener('click', function () { UI.menu(Persist.hasSave(), Game.getScores(), Game.getFreshIndex()); });
  document.getElementById('btnHelp').addEventListener('click', function () { UI.showOverlay('help'); });
  document.getElementById('btnHelpBack').addEventListener('click', function () { UI.menu(Persist.hasSave(), Game.getScores(), Game.getFreshIndex()); });
  document.getElementById('btnOverBack').addEventListener('click', function () {
    Game.setMode('MENU'); UI.menu(Persist.hasSave(), Game.getScores(), Game.getFreshIndex());
  });
  document.getElementById('btnQuit').addEventListener('click', function () {
    Game.quitToMenu();
    UI.menu(Persist.hasSave(), Game.getScores(), Game.getFreshIndex());
  });
  document.getElementById('btnPause').addEventListener('click', function () {
    if (Game.getMode() === 'PLAY') Game.setMode('PAUSED');
    else if (Game.getMode() === 'PAUSED') Game.setMode('PLAY');
  });

  Bus.on('train:delivered', function () { Game.persist(); });
  Bus.on('lives:changed', function () { Game.persist(); });
  window.addEventListener('beforeunload', function () { Game.persist(); });

  UI.menu(Persist.hasSave(), Game.getScores(), Game.getFreshIndex());

  var loop = Loop.create({
    onUpdate: function (dt) { Game.update(dt); },
    onDraw: function (alpha) {
      var st = Game.getState();
      Renderer2D.setPaused(Game.isPaused());
      if (st) {
        try { Renderer2D.draw(st, alpha); }
        catch (e) { if (typeof console !== 'undefined') console.error(e); }
      }
    }
  });

  var lastNow = 0;
  function frame(nowMs) {
    window.requestAnimationFrame(frame);
    var r = loop.advance(nowMs, Game.isPaused());
    Game.frame(nowMs, r.dt);
    lastNow = nowMs;
  }
  window.requestAnimationFrame(frame);
}

if (QUERY.debug || QUERY.selftest) {
  window.__vlacky = {
    QUERY: QUERY, CONFIG: CONFIG, RNG: RNG, Bus: Bus, Settings: Settings, MathTasks: MathTasks,
    TaskOutcome: TaskOutcome, Network: Network, Sim: Sim, Loop: Loop,
    Renderer2D: Renderer2D, Persist: Persist, Stats: Stats, Scores: Scores, I18N: I18N, SelfTest: SelfTest,
    Game: Game, MAX_TRAIN_LEN: MAX_TRAIN_LEN
  };
}

if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('DOMContentLoaded', function () {
    if (QUERY.selftest) { SelfTest.run(); return; }
    main();
  });
}
</script>
</body>
</html>
